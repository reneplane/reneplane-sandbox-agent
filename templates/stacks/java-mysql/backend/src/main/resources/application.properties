# Set for you by Reneplane Local (see .env.example to run it elsewhere)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.port=${SERVER_PORT:8000}
server.address=127.0.0.1

# Flyway applies new files in src/main/resources/db/migration when the app starts
spring.flyway.enabled=true

# JSON: snake_case keys from the SQL columns, dates as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.com.zaxxer=WARN
